<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sales Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg:        #e8ebf5;
      --surface:   #ffffff;
      --surface-2: #f2f4fb;
      --border:    #dde0ef;
      --accent:    #b36700;
      --accent-s:  #fef4e3;
      --text-1:    #0f1320;
      --text-2:    #5d6585;
      --text-3:    #9ba3bc;
      --paid:      #16a34a;
      --paid-bg:   #f0fdf4;
      --unpaid:    #8b909f;
      --unpaid-bg: #f3f4f8;
      --danger:    #dc2626;
      --nav-bg:    #0f1320;
      --nav-fg:    #e8eaf5;
      --sbw:       272px;
      --navh:      52px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:        #0b0d18;
        --surface:   #141726;
        --surface-2: #1c1f33;
        --border:    #26293f;
        --accent:    #f0a500;
        --accent-s:  #1a1000;
        --text-1:    #e4e6f5;
        --text-2:    #8890b0;
        --text-3:    #555d7a;
        --paid:      #22c55e;
        --paid-bg:   #052e16;
        --unpaid:    #5e6482;
        --unpaid-bg: #1c1f33;
        --danger:    #f87171;
        --nav-bg:    #0b0d18;
        --nav-fg:    #e4e6f5;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:        #0b0d18;
      --surface:   #141726;
      --surface-2: #1c1f33;
      --border:    #26293f;
      --accent:    #f0a500;
      --accent-s:  #1a1000;
      --text-1:    #e4e6f5;
      --text-2:    #8890b0;
      --text-3:    #555d7a;
      --paid:      #22c55e;
      --paid-bg:   #052e16;
      --unpaid:    #5e6482;
      --unpaid-bg: #1c1f33;
      --danger:    #f87171;
      --nav-bg:    #0b0d18;
      --nav-fg:    #e4e6f5;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; background: var(--bg); color: var(--text-1); line-height: 1.5; }
    button { font-family: inherit; cursor: pointer; }
    input, button { font-size: 14px; }
    img { max-width: 100%; }

    /* Nav */
    nav {
      position: sticky; top: env(safe-area-inset-top,0px);
      height: var(--navh); background: var(--nav-bg); color: var(--nav-fg);
      display: flex; align-items: center; padding-inline: 20px; gap: 12px; z-index: 100;
    }
    .brand { font-family: 'Syne', system-ui, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
    .brand-dot { color: var(--accent); }
    .seller-tag {
      font-size: 11px; background: rgba(255,255,255,.09); color: rgba(232,234,245,.65);
      padding: 3px 10px; border-radius: 100px; display: none;
    }
    .seller-tag.on { display: inline-block; }
    .nav-gap { flex: 1; }
    .theme-btn {
      background: rgba(255,255,255,.1); border: none; color: var(--nav-fg);
      width: 32px; height: 32px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
    }
    .theme-btn:hover { background: rgba(255,255,255,.18); }

    /* Shell */
    .shell {
      display: flex;
      height: calc(100% - var(--navh) - env(safe-area-inset-top,0px));
    }

    /* Sidebar */
    .sidebar {
      width: var(--sbw); flex-shrink: 0; overflow-y: auto;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 20px 16px; display: flex; flex-direction: column; gap: 24px;
    }
    .sb-title {
      font-family: 'Syne', system-ui, sans-serif;
      font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 10px;
    }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 7px 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-1); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .btn-fetch {
      width: 100%; padding: 9px; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; font-weight: 600; font-size: 13px;
      margin-top: 4px; transition: filter .15s;
    }
    .btn-fetch:hover { filter: brightness(1.1); }
    .btn-fetch:disabled { opacity: .55; cursor: not-allowed; filter: none; }
    .quick-list { display: flex; flex-direction: column; gap: 5px; }
    .btn-quick {
      width: 100%; padding: 7px 10px; text-align: left;
      background: transparent; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-2); font-size: 12px; font-weight: 500;
      transition: background .12s, color .12s, border-color .12s;
    }
    .btn-quick:hover { background: var(--accent-s); border-color: var(--accent); color: var(--accent); }

    /* Main */
    .main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    /* Stats strip */
    .stats { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .stat { flex: 1; padding: 16px 20px; border-right: 1px solid var(--border); }
    .stat:last-child { border-right: none; }
    .stat-val {
      font-family: 'Syne', system-ui, sans-serif; font-size: 26px; font-weight: 700;
      line-height: 1; font-variant-numeric: tabular-nums; color: var(--text-1);
    }
    .stat-val.a { color: var(--accent); }
    .stat-lbl { font-size: 11px; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }

    /* Panel */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .ph { display: flex; align-items: center; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
    .ph-title { font-family: 'Syne', system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .badge { font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--text-2); padding: 1px 7px; border-radius: 100px; font-variant-numeric: tabular-nums; }
    .ph-actions { margin-left: auto; display: flex; align-items: center; gap: 7px; }
    .btn-sm {
      padding: 5px 9px; border-radius: 5px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border); background: transparent; color: var(--text-2);
      display: flex; align-items: center; gap: 5px;
      transition: background .12s, color .12s;
    }
    .btn-sm:hover { background: var(--surface-2); color: var(--text-1); }
    .btn-save {
      padding: 6px 14px; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
      transition: filter .15s;
    }
    .btn-save:hover { filter: brightness(1.1); }
    .filter-in {
      padding: 5px 9px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text-1); font-size: 12px; width: 140px; outline: none;
      transition: border-color .15s;
    }
    .filter-in:focus { border-color: var(--accent); }

    /* Table */
    .tw { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 9px 12px; text-align: left; font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; color: var(--text-3);
      background: var(--surface-2); white-space: nowrap;
    }
    thead th:first-child { padding-left: 16px; }
    thead th:last-child  { padding-right: 16px; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    tbody td { padding: 10px 12px; vertical-align: middle; }
    tbody td:first-child { padding-left: 16px; }
    tbody td:last-child  { padding-right: 16px; }
    .tc { max-width: 260px; }
    .tt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .ts { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .pc { font-family: 'Syne', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dc { font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .link-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--border);
      background: transparent; color: var(--text-2); text-decoration: none;
      transition: background .12s, color .12s;
    }
    .link-btn:hover { background: var(--surface-2); color: var(--text-1); }
    .del-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 5px; border: 1px solid transparent;
      background: transparent; color: var(--text-3); opacity: 0;
      transition: opacity .12s, background .12s, color .12s;
    }
    tbody tr:hover .del-btn { opacity: 1; }
    .del-btn:hover { background: #fee2e2; color: var(--danger); border-color: #fca5a5; }

    /* Payment pill */
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 100px; font-size: 11.5px; font-weight: 500; border: none;
      cursor: pointer; white-space: nowrap; transition: opacity .12s;
    }
    .pill:hover { opacity: .8; }
    .pill.paid   { background: var(--paid-bg);   color: var(--paid); }
    .pill.unpaid { background: var(--unpaid-bg); color: var(--unpaid); }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* Result badge */
    .rbadge {
      display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: 100px; text-transform: uppercase; letter-spacing: .04em;
    }
    .rbadge.new  { background: var(--accent-s); color: var(--accent); }
    .rbadge.saved { background: var(--paid-bg); color: var(--paid); }

    /* Notes */
    .note {
      min-width: 100px; max-width: 180px; font-size: 12px; color: var(--text-2);
      outline: none; border-bottom: 1px solid transparent; padding: 2px 2px;
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: border-color .15s;
    }
    .note:empty::before { content: attr(data-ph); color: var(--text-3); }
    .note:focus { border-bottom-color: var(--accent); color: var(--text-1); white-space: normal; overflow: visible; }

    /* Panel footer */
    .pf {
      padding: 11px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface-2);
    }
    .sel-count { font-size: 12px; color: var(--text-2); }

    /* Empty */
    .empty { padding: 48px 20px; text-align: center; color: var(--text-3); }
    .empty svg { margin-bottom: 10px; opacity: .4; }
    .empty p { font-size: 13px; }

    input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

    /* Spinner */
    .spin-ov { position: fixed; inset: 0; background: rgba(0,0,0,.22); display: none; align-items: center; justify-content: center; z-index: 200; }
    .spin-ov.on { display: flex; }
    .spin-box { background: var(--surface); border-radius: 12px; padding: 24px 32px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-msg { font-size: 13px; color: var(--text-2); }

    /* Toast */
    .toast-area { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom,0px)); right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
    .toast { padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,.15); animation: tin .2s ease; pointer-events: auto; }
    @keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .toast.success { background: var(--paid-bg);  color: var(--paid);   border: 1px solid color-mix(in srgb,var(--paid) 25%,transparent); }
    .toast.error   { background: #fee2e2;          color: var(--danger); border: 1px solid #fca5a5; }
    .toast.info    { background: var(--surface);   color: var(--text-2); border: 1px solid var(--border); }
    .toast.warning { background: var(--accent-s);  color: var(--accent); border: 1px solid color-mix(in srgb,var(--accent) 30%,transparent); }

    @media (max-width: 640px) {
      .shell { flex-direction: column; height: auto; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .stats { flex-direction: column; }
      .stat { border-right: none; border-bottom: 1px solid var(--border); }
      .stat:last-child { border-bottom: none; }
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>

<div class="spin-ov" id="spinner">
  <div class="spin-box">
    <div class="spinner"></div>
    <div class="spin-msg" id="spin-msg">Loading…</div>
  </div>
</div>
<div class="toast-area" id="toasts"></div>

<nav>
  <span class="brand">Sales<span class="brand-dot">.</span>Tracker</span>
  <span class="seller-tag" id="seller-tag"></span>
  <div class="nav-gap"></div>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle light/dark">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
  </button>
</nav>

<div class="shell">
  <aside class="sidebar">
    <div>
      <div class="sb-title">Search</div>
      <div class="field">
        <label>Seller username</label>
        <input type="text" id="seller-input" placeholder="e.g. gadget_palace_99">
      </div>
      <div class="field">
        <label>From</label>
        <input type="date" id="date-from">
      </div>
      <div class="field">
        <label>To</label>
        <input type="date" id="date-to">
      </div>
      <button class="btn-fetch" id="fetch-btn" onclick="searchItems()">Fetch Sold Items</button>
    </div>
    <div>
      <div class="sb-title">Quick ranges</div>
      <div class="quick-list">
        <button class="btn-quick" onclick="setRange(7)">Last 7 days</button>
        <button class="btn-quick" onclick="setRange(30)">Last 30 days</button>
        <button class="btn-quick" onclick="setRange(90)">Last 90 days</button>
        <button class="btn-quick" onclick="setCurrentMonth()">This month</button>
        <button class="btn-quick" onclick="setLastMonth()">Last month</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="st-total">—</div>
        <div class="stat-lbl">Items tracked</div>
      </div>
      <div class="stat">
        <div class="stat-val a" id="st-rev">—</div>
        <div class="stat-lbl">Total revenue</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="st-pend">—</div>
        <div class="stat-lbl">Payment pending</div>
      </div>
    </div>

    <div class="panel" id="results-panel" hidden>
      <div class="ph">
        <span class="ph-title">Search Results</span>
        <span class="badge" id="res-count">0</span>
        <div class="ph-actions">
          <button class="btn-sm" onclick="selectAll(true)">All</button>
          <button class="btn-sm" onclick="selectAll(false)">None</button>
        </div>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" id="all-cb" onchange="selectAll(this.checked)"></th>
              <th>Item</th>
              <th>Price</th>
              <th>Date sold</th>
              <th>Status</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody id="res-body"></tbody>
        </table>
      </div>
      <div class="pf">
        <span class="sel-count"><span id="sel-count">0</span> selected</span>
        <button class="btn-save" onclick="saveSelected()">Save to database</button>
      </div>
    </div>

    <div class="panel">
      <div class="ph">
        <span class="ph-title">Saved Items</span>
        <span class="badge" id="saved-count">0</span>
        <div class="ph-actions">
          <input class="filter-in" id="filter-in" type="text" placeholder="Filter…" oninput="renderSaved()">
          <button class="btn-sm" onclick="loadSaved()" aria-label="Refresh">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="saved-body">
        <div class="empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          <p>Search for a seller and save items to start tracking.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
function toggleTheme(){const r=document.documentElement;const d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);const n=d?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('theme',n);}

let searchResults=[], savedItems=[];

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=(v,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(v);
const fmtDate=s=>{if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});};

function spin(show,msg='Loading…'){document.getElementById('spinner').classList.toggle('on',show);document.getElementById('spin-msg').textContent=msg;}
function toast(msg,type='info'){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3500);}

function setRange(d){const to=new Date(),fr=new Date();fr.setDate(fr.getDate()-d);document.getElementById('date-from').value=fr.toISOString().slice(0,10);document.getElementById('date-to').value=to.toISOString().slice(0,10);}
function setCurrentMonth(){const n=new Date();document.getElementById('date-from').value=new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10);document.getElementById('date-to').value=n.toISOString().slice(0,10);}
function setLastMonth(){const n=new Date();document.getElementById('date-from').value=new Date(n.getFullYear(),n.getMonth()-1,1).toISOString().slice(0,10);document.getElementById('date-to').value=new Date(n.getFullYear(),n.getMonth(),0).toISOString().slice(0,10);}

async function searchItems(){
  const seller=document.getElementById('seller-input').value.trim();
  const date_from=document.getElementById('date-from').value;
  const date_to=document.getElementById('date-to').value;
  if(!seller){toast('Enter a seller username.','warning');return;}
  spin(true,'Fetching sold listings from eBay…');
  document.getElementById('fetch-btn').disabled=true;
  try{
    const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seller,date_from,date_to})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Search failed');
    searchResults=data.items||[];
    renderResults();
    document.getElementById('results-panel').hidden=false;
    const st=document.getElementById('seller-tag');st.textContent=seller;st.classList.add('on');
    toast(`Found ${searchResults.length} sold listing${searchResults.length!==1?'s':''}.`,searchResults.length?'success':'info');
  }catch(e){toast(e.message,'error');}
  finally{spin(false);document.getElementById('fetch-btn').disabled=false;}
}

function renderResults(){
  const tbody=document.getElementById('res-body');
  document.getElementById('res-count').textContent=searchResults.length;
  if(!searchResults.length){
    tbody.innerHTML=`<tr><td colspan="6"><div class="empty"><p>No sold items found for this seller and date range.</p></div></td></tr>`;
    updateSel();return;
  }
  tbody.innerHTML=searchResults.map((it,i)=>`
    <tr>
      <td><input type="checkbox" class="rcb" data-i="${i}" onchange="updateSel()" ${it.already_saved?'disabled checked':''}></td>
      <td class="tc"><span class="tt" title="${esc(it.title)}">${esc(it.title)}</span>${it.condition?`<span class="ts">${esc(it.condition)}</span>`:''}</td>
      <td class="pc">${fmt(it.sold_price,it.currency)}</td>
      <td class="dc">${fmtDate(it.sold_date)}</td>
      <td><span class="rbadge ${it.already_saved?'saved':'new'}">${it.already_saved?'Saved':'New'}</span></td>
      <td><a href="${esc(it.ebay_link)}" target="_blank" rel="noopener" class="link-btn">${ICON_LINK}</a></td>
    </tr>`).join('');
  updateSel();
}

function updateSel(){document.getElementById('sel-count').textContent=document.querySelectorAll('.rcb:not([disabled]):checked').length;}
function selectAll(v){document.querySelectorAll('.rcb:not([disabled])').forEach(c=>c.checked=v);const a=document.getElementById('all-cb');if(a)a.checked=v;updateSel();}

async function saveSelected(){
  const cbs=document.querySelectorAll('.rcb:not([disabled]):checked');
  if(!cbs.length){toast('Select at least one item.','warning');return;}
  const items=Array.from(cbs).map(c=>searchResults[+c.dataset.i]);
  spin(true,'Saving…');
  try{
    const r=await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Save failed');
    toast(`${data.saved} item${data.saved!==1?'s':''} saved.${data.skipped?` (${data.skipped} already existed)`:''}`, 'success');
    cbs.forEach(c=>{searchResults[+c.dataset.i].already_saved=true;c.disabled=true;});
    renderResults();
    await Promise.all([loadSaved(),loadStats()]);
  }catch(e){toast(e.message,'error');}
  finally{spin(false);}
}

async function loadSaved(){
  try{const r=await fetch('/api/items');const d=await r.json();savedItems=d.items||[];renderSaved();}
  catch{toast('Failed to load saved items.','error');}
}

function renderSaved(){
  const f=document.getElementById('filter-in').value.toLowerCase();
  const items=f?savedItems.filter(i=>i.title.toLowerCase().includes(f)):savedItems;
  document.getElementById('saved-count').textContent=savedItems.length;
  const cont=document.getElementById('saved-body');
  if(!savedItems.length){
    cont.innerHTML=`<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><p>Search for a seller and save items to start tracking.</p></div>`;
    return;
  }
  if(!items.length){cont.innerHTML=`<div class="empty"><p>No items match "${esc(f)}".</p></div>`;return;}
  cont.innerHTML=`<div class="tw"><table>
    <thead><tr><th>Item</th><th>Price</th><th>Date sold</th><th>Payment</th><th>Notes</th><th>Link</th><th></th></tr></thead>
    <tbody>${items.map(it=>`
      <tr>
        <td class="tc"><span class="tt" title="${esc(it.title)}">${esc(it.title)}</span><span class="ts">${esc(it.seller||'')}${it.condition?' · '+esc(it.condition):''}</span></td>
        <td class="pc">${fmt(it.sold_price,it.currency)}</td>
        <td class="dc">${fmtDate(it.sold_date)}</td>
        <td><button class="pill ${it.payment_received?'paid':'unpaid'}" onclick="togglePay(${it.id},${!it.payment_received})"><span class="pill-dot"></span>${it.payment_received?'Paid':'Unpaid'}</button></td>
        <td><span class="note" contenteditable="true" data-ph="Add note…" onblur="saveNote(${it.id},this.textContent.trim())" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${esc(it.notes||'')}</span></td>
        <td><a href="${esc(it.ebay_link)}" target="_blank" rel="noopener" class="link-btn">${ICON_LINK}</a></td>
        <td><button class="del-btn" onclick="delItem(${it.id})" aria-label="Delete">${ICON_TRASH}</button></td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

async function togglePay(id,val){
  try{
    const r=await fetch(`/api/items/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_received:val})});
    if(!r.ok)throw new Error('Update failed');
    const u=await r.json();
    const i=savedItems.findIndex(x=>x.id===id);if(i!==-1)savedItems[i]=u;
    renderSaved();await loadStats();
  }catch(e){toast(e.message,'error');}
}

const noteT={};
async function saveNote(id,notes){
  const it=savedItems.find(x=>x.id===id);if(it&&it.notes===notes)return;
  clearTimeout(noteT[id]);
  noteT[id]=setTimeout(async()=>{
    try{
      const r=await fetch(`/api/items/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes})});
      if(!r.ok)throw new Error();
      const u=await r.json();const i=savedItems.findIndex(x=>x.id===id);if(i!==-1)savedItems[i]=u;
    }catch{toast('Failed to save note.','error');}
  },400);
}

async function delItem(id){
  if(!confirm('Remove this item from your database?'))return;
  try{
    const r=await fetch(`/api/items/${id}`,{method:'DELETE'});
    if(!r.ok)throw new Error('Delete failed');
    savedItems=savedItems.filter(x=>x.id!==id);renderSaved();await loadStats();toast('Item removed.','info');
  }catch(e){toast(e.message,'error');}
}

async function loadStats(){
  try{
    const r=await fetch('/api/stats');const d=await r.json();
    document.getElementById('st-total').textContent=d.total_items;
    document.getElementById('st-rev').textContent=fmt(d.total_revenue);
    document.getElementById('st-pend').textContent=d.payment_pending_count?`${d.payment_pending_count} · ${fmt(d.payment_pending_value)}`:'0';
  }catch{}
}

const ICON_LINK=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
const ICON_TRASH=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

setRange(30);
loadSaved();
loadStats();
</script>
</body>
</html>
